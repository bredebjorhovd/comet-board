# The repository recipe (gh#422, docs/board/gh-422-*.md): what a fresh
# worktree of THIS repo needs before an agent starts in it.
#
# Deliberately no [setup] yet: this repository has no required generated files
# or install step. Cargo resolves the committed lockfile when the explicit run
# or test command starts; prefetching it would move the same work earlier
# without making the checkout more ready.

version = 1

# The canonical development command — recorded so nothing has to guess it.
# Started explicitly (a person, or an agent that read this), never by comet.
[run]
run = "cargo run -p comet"

# Bounded cleanup of reproducible output before the board reclaims a finished
# checkout. Everything this repo generates is under target/. Archive is an
# engine-owned declarative cleanup contract: no repository command or mutable
# script executes after an agent has worked in the checkout.
[archive]
paths = ["target"]
