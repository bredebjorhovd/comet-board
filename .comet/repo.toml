# The repository recipe (gh#422, docs/board/gh-422-*.md): what a fresh
# worktree of THIS repo needs before an agent starts in it.
#
# Deliberately no [setup] yet: the builds here want cargo, and cargo's PATH is
# a property of the box user's shell, not of the engine process that runs this
# step — a `cargo fetch` that fails on a box where cargo lives outside the
# default PATH would block every dispatch on this repo to save a network
# round-trip. Add one when there is a step that pays for that risk.

version = 1

# The canonical development command — recorded so nothing has to guess it.
# Started explicitly (a person, or an agent that read this), never by comet.
[run]
run = "cargo run -p comet"

# Bounded cleanup of reproducible output before the board reclaims a finished
# checkout. Everything this repo generates is under target/, which the board's
# own sweep (gh#186) already knows by name — cargo clean just gets there
# politely first, and a box without cargo on PATH loses nothing but that.
[archive]
run = "cargo clean"
timeout = "5m"
