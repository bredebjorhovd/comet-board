name: release

# Build release artifacts and publish them:
#   - Linux headless tarballs (x86_64 + aarch64) via scripts/package-linux.sh
#   - macOS dmg (Apple silicon) via scripts/package-macos.sh
# then create a GitHub Release AND upload everything to our
# `comet-native-releases` R2 bucket (served at
# edge.comet.offhand.dev/releases/* for
# `curl -fsSL https://edge.comet.offhand.dev/install.sh | sh`), bumping
# latest.txt.
#
# A release is published in two halves and is not done until both are: the
# GitHub release goes up as a **prerelease**, and it is promoted only after the
# edge has been asked, over its public host, whether it is serving this version
# (gh#197). Every R2 put retries — the 502 that half-published v0.3.5 came from
# api.cloudflare.com, not from the bucket — and latest.txt, the pointer
# install.sh resolves, is written last and only after the artifacts it names
# have been fetched back.
#
# Trigger: push a tag `v<version>` matching the workspace version in
# Cargo.toml (bump it in the same commit), or run manually via
# workflow_dispatch (builds + uploads artifacts, no release/R2 publish).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # x86_64
          - runner: ubuntu-24.04-arm # aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: gpui system deps
        # Bounded and non-interactive: a stalled mirror here once hung the
        # v0.9.0 release for 97 minutes on a step that normally takes one,
        # because the job's only ceiling was GitHub's 6-hour default.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: package
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ runner.arch }}
          path: target/package/*.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-latest # Apple silicon
    env:
      # `secrets` is not a valid context in step `if:` — same trick as the
      # publish job below. Presence of the p12 is what switches the build from
      # ad-hoc to Developer ID; everything else follows from it.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@v4
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Import into a keychain created for this run and deleted with the
      # runner: the p12 never lands in the login keychain, and nothing has to
      # be cleaned up if the job dies. Skipped entirely without the secret,
      # which leaves CODESIGN_IDENTITY unset and the ad-hoc path unchanged.
      - name: import Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$keychain"
          # Long timeout deliberately: the keychain must still be unlocked
          # after a cold cargo build plus a notarization round-trip, and it
          # dies with the runner regardless.
          security set-keychain-settings -t 21600 -u "$keychain"
          security unlock-keychain -p "$pw" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on a GUI keychain prompt that no one
          # is there to answer and the job hangs until the step times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$pw" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          identity="$MACOS_SIGNING_IDENTITY"
          if [ -z "$identity" ]; then
            identity=$(security find-identity -v -p codesigning "$keychain" \
              | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          fi
          [ -n "$identity" ] || { echo "no Developer ID Application identity in the imported p12"; exit 1; }
          echo "::add-mask::$identity"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: notary credentials
        if: env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          # Either credential form works; the App Store Connect API key wins if
          # both are set. Signing without notarizing still leaves a downloaded
          # app Gatekeeper-rejected, so the script warns rather than pretending.
          if [ -n "$MACOS_NOTARY_KEY" ]; then
            printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            {
              echo "MACOS_NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
              echo "MACOS_NOTARY_KEY_ID=$MACOS_NOTARY_KEY_ID"
              echo "MACOS_NOTARY_ISSUER_ID=$MACOS_NOTARY_ISSUER_ID"
            } >> "$GITHUB_ENV"
          elif [ -n "$MACOS_NOTARY_APPLE_ID" ]; then
            {
              echo "MACOS_NOTARY_APPLE_ID=$MACOS_NOTARY_APPLE_ID"
              echo "MACOS_NOTARY_TEAM_ID=$MACOS_NOTARY_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Developer ID certificate present but no MACOS_NOTARY_* credentials — the build will be signed but not notarized, and downloads will still need the quarantine workaround."
          fi
      - name: package dmg
        env:
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ runner.arch }}
          path: |
            target/package/*.dmg
            target/package/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-latest
    # The retention workflow uses the same group. The bucket's publication
    # transaction and a cleanup therefore cannot observe one another halfway.
    concurrency:
      group: r2-release-mutation
      cancel-in-progress: false
    env:
      # `secrets` is not a valid context in step `if:` expressions — surface
      # the token through job env and gate on that instead. The token is the
      # same repo secret deploy.yml uses: our account, Workers Scripts +
      # R2 Storage edit (scripts/edge-setup-wizard.sh stage 8).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Mirrors the gate in the macos job: with no certificate the dmg is
      # ad-hoc signed, and the release notes have to say so.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
    steps:
      # Checked out for edge/wrangler.jsonc only — the account id lives there
      # and nowhere else, so moving the edge to another account can't leave
      # releases uploading into the old one. Must precede download-artifact:
      # checkout cleans the workspace.
      - uses: actions/checkout@v4
      - name: cloudflare account + edge host (from edge/wrangler.jsonc)
        run: |
          acct=$(sed -n 's/.*"account_id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
            edge/wrangler.jsonc | head -1)
          [ -n "$acct" ] || { echo "no account_id in edge/wrangler.jsonc"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$acct" >> "$GITHUB_ENV"
          # Read for the same reason the account id is: the host that serves
          # /releases/* is a fact about the edge, and the read-back below is
          # only worth anything if it interrogates the host install.sh will
          # actually ask. Moving the edge must not leave this verifying the
          # old one and passing.
          host=$(sed -n 's/.*"pattern"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
            edge/wrangler.jsonc | head -1)
          [ -n "$host" ] || { echo "no route pattern in edge/wrangler.jsonc"; exit 1; }
          echo "EDGE_HOST=$host" >> "$GITHUB_ENV"
      # Not `dist/`: that path is tracked in the repo (desktop entry, icons).
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: version guard (tag == artifact version)
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ls artifacts/
          ls artifacts/ | grep -q "comet-$ver-" \
            || { echo "tag v$ver does not match built artifact versions — bump Cargo.toml [workspace.package] version"; exit 1; }
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      # The macOS install note goes above the generated changelog because it is
      # the first thing a downloader needs and the failure it prevents looks
      # like a corrupt download, not a policy decision. Written only while the
      # dmg is ad-hoc signed — a notarized build needs no such note, and a
      # stale one would teach people to strip quarantine out of habit.
      - name: macOS note for the release body
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12" ] \
            && { [ -n "$MACOS_NOTARY_KEY" ] || [ -n "$MACOS_NOTARY_APPLE_ID" ]; }; then
            : > release-body.md
            exit 0
          fi
          cat > release-body.md <<'EOF'
          ### macOS: one step before first launch

          The dmg is **not signed with an Apple Developer ID** — the project
          does not have one yet — so macOS quarantines it on download and
          Gatekeeper refuses to open it, with a dialog that explains nothing
          ("Comet can't be opened" / "Appen kan ikke åpnes", error -50).

          Drag `Comet.app` to Applications, then run this once:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Comet.app
          ```

          Comet then opens normally, and `comet update` is unaffected from
          there on. Full explanation: [docs/macos-install.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/macos-install.md).

          ---
          EOF
      # Created as a **prerelease**, and promoted only after the edge is
      # verified to be serving this version (gh#197). Publishing is two halves
      # — assets onto the release, artifacts into R2 — and the second half can
      # fail on its own, which is exactly what happened cutting v0.3.5: four
      # assets attached, `latest.txt` still naming 0.3.4, and a release page
      # that looked finished. The prerelease flag is what makes the half-done
      # state legible to everything that reads a release rather than a run:
      # `gh release view` says Pre-release, the "Latest" badge stays on the
      # version the edge is actually handing out, and `/releases/latest` keeps
      # pointing there too.
      - uses: softprops/action-gh-release@v2
        id: release
        with:
          files: artifacts/*
          body_path: release-body.md
          generate_release_notes: true
          prerelease: true
      - name: mark the R2 publication in progress
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/release-retention.mjs publication-start "$VERSION"
      - name: upload to R2 (edge.comet.offhand.dev/releases/*)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # Every put goes through scripts/r2-put.sh, which retries (gh#197) —
          # the 502 that ended the v0.3.5 publish came from api.cloudflare.com
          # rather than from the bucket, and the same put a moment later worked.
          #
          # Order is load-bearing and stated here so it cannot be shuffled by
          # accident: artifacts, then manifest.json, then — after the read-back
          # step below has seen all of them through the public host — latest.txt.
          # The pointer is what install.sh and `comet update` resolve, so a
          # pointer ahead of its artifacts hands every box a 404 mid-upgrade;
          # that is strictly worse than the pointer lagging, which is only a box
          # that does not upgrade.
          for f in artifacts/*; do
            scripts/r2-put.sh "$(basename "$f")" "$f"
          done
          # manifest.json: version + per-artifact sha256 — the auto-updater
          # (crates/update) verifies downloads against it. Published before
          # latest.txt so no client ever sees a version without its checksums.
          manifest=$(jq -n --arg version "$VERSION" '{version: $version, files: {}}')
          for f in artifacts/*; do
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            manifest=$(jq --arg name "$(basename "$f")" --arg sha "$sha" \
              '.files[$name] = {sha256: $sha}' <<<"$manifest")
          done
          printf '%s' "$manifest" > manifest.json
          scripts/r2-put.sh manifest.json manifest.json

      # The gate between the two halves of the pointer rule above: nothing
      # writes latest.txt until every artifact it will name has been fetched
      # back through the host that serves them. Read over the public edge
      # rather than out of the bucket on purpose — an object in R2 that the
      # worker does not serve is not published, and this is the same request
      # install.sh makes.
      - name: artifacts are reachable before the pointer moves
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          base="https://$EDGE_HOST/releases"
          for f in artifacts/*; do
            name=$(basename "$f")
            curl -fsS -I -o /dev/null "$base/$name" \
              || { echo "::error::$base/$name is not being served — not moving latest.txt onto a release that cannot be downloaded"; exit 1; }
          done
          # `?v=` because the mutable objects are served with max-age=60
          # (edge/src/index.ts): a cached copy of the *previous* manifest read
          # back here would be reassurance about the wrong release.
          got=$(curl -fsSL "$base/manifest.json?v=$GITHUB_RUN_ID" | jq -r .version)
          [ "$got" = "$VERSION" ] \
            || { echo "::error::manifest.json at the edge says '$got', expected '$VERSION'"; exit 1; }
          echo "all $(ls artifacts | wc -l) artifact(s) + manifest.json served at $base"

      - name: move the pointer (latest.txt)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          printf '%s' "$VERSION" > latest.txt
          scripts/r2-put.sh latest.txt latest.txt
          base="https://$EDGE_HOST/releases"
          served=$(curl -fsSL "$base/latest.txt?v=$GITHUB_RUN_ID" | tr -d '[:space:]')
          [ "$served" = "$VERSION" ] \
            || { echo "::error::$base/latest.txt serves '$served' after the upload, expected '$VERSION'"; exit 1; }
          echo "the edge now hands out $served"

      # A failure before here deliberately leaves the marker behind. Retention
      # then blocks rather than treating the partial root-key set as an old
      # release. A rerun overwrites the marker and clears it only after the
      # public pointer has been read back successfully.
      - name: mark the R2 publication complete
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/release-retention.mjs publication-finish "$VERSION"

      # Only now is the release a release. Without a token there is no R2 half
      # to verify and the GitHub release is the whole of it, so this runs
      # either way — a repo with no Cloudflare secret must not accumulate
      # permanent prereleases.
      - name: promote the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `clear` before the flag: on a rerun of a publish that failed once,
          # the warning below is on the body and this is what takes it off.
          scripts/release-notice.sh clear "$GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest
          echo "v$VERSION published: assets on the release, artifacts at https://$EDGE_HOST/releases/" \
            >> "$GITHUB_STEP_SUMMARY"

      # The whole point of gh#197: a run that goes red while the release page
      # looks finished teaches everyone who reads the page — humans included —
      # the wrong answer. The release stays a prerelease (the step above never
      # ran), and this writes the reason where somebody looking at the release
      # will meet it rather than in a log nobody opens.
      - name: say so on the release
        if: failure() && steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### v$VERSION did NOT publish"
            echo "The GitHub release exists and is complete; the edge still serves the previous version."
            echo "Re-run the failed job, then check https://$EDGE_HOST/releases/latest.txt."
          } >> "$GITHUB_STEP_SUMMARY"
          scripts/release-notice.sh add "$GITHUB_REF_NAME" "$EDGE_HOST"
