name: ci

# Build + test every pull request, and every push to main.
#
# Why this exists: gh#56 and gh#59 both reported MERGEABLE/CLEAN and were green
# on their own branches, but the *merged* tree did not compile — two E0061s git
# could not see, because no line of text conflicted. With agents working in
# parallel worktrees that recurs by construction, so the merged result has to be
# compiled by something other than a human remembering to.
#
# `pull_request` builds the merge commit (branch merged into the base), which is
# exactly the tree those E0061s lived in. The push-to-main job is the backstop
# for anything that lands without a PR.
#
# The workspace is not the whole repo: edge/ is TypeScript, and for a while the
# two cargo jobs were all there was, so a pull request touching only edge/ went
# green without a single one of its 74 tests running (gh#380). The `edge` job
# below closes that.
#
# Not here on purpose:
#   - `cargo fmt --check`: main currently has ~249 diffs, so gating on it would
#     fail every PR. Separate cleanup if wanted.
#   - macOS: the release job already type-checks the Apple cfg paths, and it is
#     the platform where `repos_round_trip_add_branches_worktrees` trips over the
#     /private tempdir symlink.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per PR: a new push cancels the previous, still-building run. main is
# keyed per-sha so pushes never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Backtraces on a failing test are the whole point of reading CI output.
  RUST_BACKTRACE: 1
  # The harness integration tests spawn real children and wait on their
  # streams, so their deadlines cover process spawn, connect and teardown — not
  # the thing under test. A shared 2-core runner also building this workspace
  # ate a 7.5x margin twice on one commit (gh#167). Stretch every one of those
  # deadlines rather than editing literals one flake at a time; see
  # crates/harness/tests/common/mod.rs.
  COMET_TEST_TIMEOUT_SCALE: 4

jobs:
  # test and clippy are separate jobs so they run in parallel: clippy compiles
  # every crate through clippy-driver and shares almost no artifacts with a
  # rustc test build, so folding them into one job would serialize two full
  # builds of the gpui tree for no cache win.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: gpui system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # No --all-targets here: it would silently drop doctests.
      - name: cargo test --workspace
        run: cargo test --workspace

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: gpui system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy --all-targets
        run: cargo clippy --workspace --all-targets

  # The edge Worker's own tests, on the pull request rather than after it.
  #
  # Neither cargo job above touches edge/, so `cargo test --workspace` on an
  # edge-only change is green by vacuity. Until this job existed the 74 vitest
  # tests first ran in deploy.yml — `on: push: branches: [main]`, i.e. *after*
  # merge — where a failure aborts the deploy and leaves main carrying code the
  # live edge is not running, signalled only by a red workflow on a branch
  # nobody is looking at any more. That is the wrong way round for the directory
  # holding the Loro sync layer both room classes implement, the absorbed WorkOS
  # auth routes, and the /releases/* surface every install and update comes
  # through.
  #
  # install/typecheck/test are deploy.yml's three steps, lifted rather than
  # reinvented, so the gate and the deploy cannot disagree about what passing
  # means. deploy.yml keeps running them too: it is the last gate before the
  # live edge, and a force-push or a merge queue can still reach it without
  # passing through here. deploy.yml is in the detect pattern below for that
  # reason — a change to the steps it runs re-runs this job to check the two
  # still agree.
  #
  # Read a green `edge` check carefully: it means *either* both vitest tiers
  # (Node unit + workerd, gh#413) passed *or* the pull request never touched
  # edge/ and the steps were skipped. A
  # skipped step reports success like any other, so the check alone does not
  # tell you the tests ran — look for `changed=true` in the detect step, or for
  # the install/typecheck/test steps having a non-zero duration.
  #
  # Always-runs, conditional steps — rather than a `paths:` filter, which in
  # Actions applies to the whole workflow and would take the cargo jobs with it,
  # and which would also make this un-*required*-able (a required check that
  # never runs blocks the PR forever). The job therefore reports on every pull
  # request; a Rust-only one pays a checkout and a `git diff` — call it fifteen
  # seconds — and never installs node. Metered minutes are the reason for the
  # gating; requirability is the reason it is at step level and not workflow
  # level.
  #
  # Not run on push-to-main: deploy.yml already runs these same three steps
  # there, and paying twice per merge buys nothing.
  edge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The default depth-1 fetch of the merge commit has no base commit to
          # diff against.
          fetch-depth: 0
      - name: detect edge changes
        id: changed
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" "$GITHUB_SHA" \
            | grep -qE "^(edge/|\.github/workflows/(ci|deploy)\.yml)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: install
        if: steps.changed.outputs.changed == 'true'
        working-directory: edge
        run: npm ci
      - name: typecheck
        if: steps.changed.outputs.changed == 'true'
        working-directory: edge
        run: npm run typecheck
      # Two tiers, two steps: `npm test` runs both, but a workerd failure
      # buried inside one step reads as "the edge tests failed" — split, the
      # step name says whether pure logic broke or the runtime disagreed with
      # our fakes (gh#413). deploy.yml keeps its single `npm test`, which runs
      # the same two tiers in the same order, so the gates still agree.
      - name: test (unit)
        if: steps.changed.outputs.changed == 'true'
        working-directory: edge
        run: npm run test:unit
      - name: test (workerd)
        if: steps.changed.outputs.changed == 'true'
        working-directory: edge
        run: npm run test:workerd
