# Copy to the board config dir and edit:
#   cp routing.example.toml ~/.comet-native/board/routing.toml

[sync]
# How often syncd polls. Floors at 5s.
interval = "30s"

# First matching route wins. All keys given in `match` must match (AND).
# Available keys: gh_repo, label.
[[route]]
match = { gh_repo = "you/offhand" }
workspace = "offhand"          # a comet SPACE name (device + folder pair)
repo = "~/code/offhand"        # the git repo worktrees are cut from
runtime = "claude-code"        # display name; mapped to comet harness ClaudeCode
prompt = """
You are working on: {title} ({identifier})

{body}

Work in this worktree. Open a PR when done; branch {branch} is prepared.
"""

[[route]]
match = { label = "fintech" }
workspace = "fintech"
repo = "~/code/tripletex-int"
runtime = "claude-code"

# `runtime` is not decoration. Anything `runtime::harness_for_runtime` maps is
# dispatchable — `codex` and `cursor` alongside `claude-code`. `doctor` rejects
# a runtime it cannot map rather than failing at dispatch time.
#
# `match` ANDs its keys, so one repo can route to different runtimes by label.
[[route]]
match = { gh_repo = "you/scratch", label = "codex" }
workspace = "scratch"
repo = "~/code/scratch"
runtime = "codex"

# `account` names which saved Claude/Codex login a route's dispatches run
# under — i.e. whose subscription pays for them. One box, several teammates:
# each attaches their own sub under Agent accounts, routes point at it, and a
# dispatch burns its owner's limits rather than everyone sharing one login.
#
# The value is a slot id; `comet-board doctor` lists the ids this device has
# saved, with the email and CLI each belongs to, and fails a route naming one
# it does not have (or a Claude login on a codex route — the two CLIs' config
# dirs are not interchangeable). `comet-board dispatch --account <id>`
# overrides it per dispatch.
#
# Omit it on a single-user box: the run then uses the CLI's own config dir,
# exactly as it did before accounts existed. Nothing infers an account from
# who dispatched — `via` records that, and guessing a login from it is the
# kind of clever that bills the wrong person.
#
# [[route]]
# match = { gh_repo = "acme/platform" }
# workspace = "platform"
# repo = "~/code/platform"
# runtime = "claude-code"
# account = "8f2c1d0a7b6e4539"

# `max_duration` is the wall-clock cap on one attempt, per route. Past it the
# board says so in the chat — once — and cancels the attempt shortly after,
# closing it `failed` with a comment upstream naming the timeout. It is per
# route because the answer is a property of the work: a route pointed at a
# refactor across a monorepo is not the one that fixes typos, and a single
# number gets set by whichever runs longest, leaving every other route's
# runaway agent going until somebody looks.
#
# [[route]]
# match = { label = "refactor" }
# workspace = "platform"
# repo = "~/code/platform"
# runtime = "claude-code"
# max_duration = "6h"

# `max_tool_failures` and `max_tool_calls` are the *turn*-level guardrails, and
# they catch what `max_duration` cannot: the run that is failing at full speed.
# An agent retrying the same broken command, or making tool calls without end,
# spends two hours' worth of tokens in the first ten minutes — and the wall
# clock charges for all of it before it steps in.
#
# `max_tool_failures` counts tool calls that fail *in a row* inside one turn.
# The same call failing that many times gets one message into the chat naming
# what is looping — most loops are recoverable, and an interrupt throws away a
# worktree's worth of context — and at twice that many the board ends the run.
# Assorted calls failing get twice the rope; a single call that lands clears the
# count entirely. `max_tool_calls` is the same ladder on sheer volume, for the
# turn that never fails and never finishes.
#
# A stopped run is a *block*, not a lost attempt: the chat keeps the whole task,
# the dispatching agent and the orchestrator are told as they are about any
# other block, and retry-or-cancel is yours.
#
# Per route because what counts as a normal number of failures is a property of
# the work — a repo whose suite is flaky under load fails a lot without being
# stuck, and a route that edits config files does not fail at all.
#
# [[route]]
# match = { gh_repo = "acme/flaky-under-load" }
# workspace = "platform"
# repo = "~/code/platform"
# runtime = "claude-code"
# max_tool_failures = "40"
# max_tool_calls = "off"

# `billing_guard` decides what the board does when a dispatch would spend
# somebody else's subscription — the teammate presses enter, the route's account
# (or the box's own login) pays, and before gh#101 nobody was told either way.
# `warn` (the default) says so in the picker, on the CLI, in the dispatch
# comment and on the row, and releases anyway. `require-own` refuses instead,
# unless the release names the payer (`comet-board dispatch --bill <slot>`).
# `off` says nothing, which is right on a box where one person's plan pays for
# everything.
#
# Per route because the answer is a property of the work: the shared team repo
# is where a teammate spending the owner's plan is worth refusing, and the
# owner's own side project is where the warning is noise on every dispatch.
#
# A seatbelt, not a lock. The board compares the dispatching frontend's claimed
# user against the account's email, and it cannot verify that claim until comet
# has per-call identity (#66) — so this catches the accident, not the liar.
#
# [[route]]
# match = { gh_repo = "acme/platform" }
# workspace = "platform"
# repo = "~/code/platform"
# runtime = "claude-code"
# billing_guard = "require-own"

# A route with no `match` is a catch-all and must come last.

[defaults]
max_concurrent_per_workspace = 3
# The default cap, for routes that do not set their own. Two hours: long enough
# for work a dispatch is worth giving an agent, short enough that a looping one
# is noticed the same afternoon. The engine's stall watchdog only ever stopped a
# run that emitted *nothing*, so before this an agent that kept talking ran
# until somebody looked. `off` (or `0`) removes the cap, which is that old
# behaviour said out loud.
max_duration = "2h"
# The turn guardrails, for routes that do not set their own (see the per-route
# note above). Ten failing tool calls in a row is not a technique — nothing
# legitimate reaches it, because a single call that lands resets the count — and
# two thousand tool calls is far past any turn that is getting somewhere. Both
# take `off` (or `0`).
max_tool_failures = "10"
max_tool_calls = "2000"
# What to do about a dispatch that charges somebody else: warn, require-own, or
# off. See the per-route note above for what each one does.
billing_guard = "warn"
# `{identifier_lower}` is the identifier made branch-safe, then a short slug of
# the title: `gh#341` titled "The review page loads nothing" branches to
# `board/gh-341-review-page-loads`. The slug is stopword-stripped and capped, so
# it is three content words at most; a title that yields none of them leaves the
# identifier standing alone, which is always enough to name the task.
#
# It carried the *repo* until gh#364 (`gh-2-tripletex-mcp`) and no longer does:
# a branch already lives in one repo and its worktree already sits under a
# per-repo directory, so that word was spent saying nothing twice. Nothing is
# less safe for it — a pull request is attached to a task by the repo the task
# id names, never by reading a repo back out of the branch.
#
# `{identifier_slug}` and `{title_slug}` are the two halves on their own, for a
# template that wants to compose them itself — or to leave the slug out.
branch_template = "board/{identifier_lower}"
# What a dispatch's branch is cut from. The dispatch fetches this from origin
# first, then branches off the remote-tracking ref — never off the space
# folder's current HEAD, which on an always-on box is whatever was checked out
# there last week, and is how an agent ends up rewriting merged work.
#
#   origin/HEAD   the remote's default branch (the default), asked of the remote
#   main          that branch on origin; `origin/main` means the same
#   HEAD          the opt-out: branch from the checkout, no fetch. For a repo
#                 with no remote — otherwise you want the fetch.
#
# A fetch that fails (offline, auth, no such branch) refuses the dispatch; the
# alternative is a pull request with the wrong diff in it and nobody told. A
# retry is unaffected either way: it reuses the branch the first attempt cut,
# with its commits, and never rebases it onto a newer base.
base = "origin/HEAD"
# Notifications. Four audiences, and they are genuinely different:
#
#   the issue    A blocked attempt — the agent stopped to ask, or its run died
#                — leaves one comment on its own issue, per block. Not
#                configurable here and not conditional on who is watching: it
#                is the task's trail, and it is the only one that survives the
#                night. (GitHub still obeys `[github] writeback` per repo.)
#   the agent    `notify_dispatcher`, below — the chat that released the work
#                gets a prompt when it settles or blocks. On by default, and
#                tried first: it is the precise channel, prompting the one agent
#                whose plan that task was a step in.
#   the board's  `orchestrator_chat`, below — one pinned chat, and the addressee
#   orchestrator of last resort: work no chat released, work whose dispatching
#                chat is gone, and the cap warning. What the dispatcher was told
#                is never repeated to it.
#   you          `notify` + `notify_webhook`, here. The only channel that
#                reaches somebody looking at neither the board nor the tracker.
#
# `notify` is the switch, `notify_webhook` the address; either alone is
# silence, and `comet-board doctor` says so rather than reporting a notice that
# cannot fire. The body is JSON — `{"event": "on_blocked"|"on_settled", "text":
# …, "task": {…}, "attempt": {…}}` — POSTed once, with a five-second timeout
# and no retry: a notification delivered forty minutes late reads as current,
# which is worse than one that never came. One URL and no per-service
# integrations: Slack, ntfy, a pager and a two-line relay all already accept a
# POST.
# notify = true
# notify_webhook = "https://hooks.example.com/comet-board"
# The dispatcher wake: when an agent released a task through the board, prompt
# it in its own chat as that task settles or blocks. On, because it is the
# precise channel — the reader is the one agent whose plan that task was a step
# in, and a chat told about the two or three things it released is nothing like
# a chat told about the whole board. Turn it off where you dispatch from chats
# that are you at a prompt rather than agents; `notify_webhook` above is the
# channel for that reader, and every settle then falls to the pin below.
# notify_dispatcher = true
# The pinned orchestrator: one chat that drives the board and hears what nobody
# else can be told — work you released from the panel or the phone (which
# records no chat), work whose dispatching chat has been archived since, and the
# cap warning, which is about a run that is still going. What the dispatcher was
# told is never repeated here; that is what keeps a pin usable on a busy board.
#
# It is an ordinary chat: no workspace slot (the board did not dispatch it),
# though everything it releases counts against the caps like anyone's, and it
# bills whatever account its chat config names. It is exempt from
# `max_duration`, because it is meant to outlive every attempt on the board — so
# the thing to watch is notice volume, and the board sends exactly one prompt
# per event and never polls. Unset it and the notices stop; the chat carries on
# as an ordinary chat.
#
# Easier set from the app than from here: "Pin as orchestrator" on a session in
# the desktop app or the TUI writes this key for you. `docs/orchestrator.md` is
# the brief to open it with.
# orchestrator_chat = "chat_01J8Z…"
# Which tracker `comet-board new` writes to. "github" is the only supported
# value.
# new_source = "github"

# GitHub is where the board's issues come from. With no repos listed nothing is
# polled, the header omits it, and no GitHub credential is needed at all.
#
# With repos listed, the credential goes in `.env`, and there are two:
#
#   GITHUB_TOKEN=ghp_…                       a classic personal access token
#                                              (`repo` + `workflow` scopes)
#
#   GITHUB_APP_ID=123456                     a GitHub App
#   GITHUB_APP_PRIVATE_KEY_PATH=/…/app.pem   (chmod 600)
#
# There is a third, and it is not the board's: `GITHUB_USER_TOKEN_<LOGIN>` is a
# reviewer's own token, spent on one call — submitting their verdict. See
# `[users]` below.
#
# The token is simplest and stays supported — it belongs to an account and
# carries that account's whole reach, which is fine for a board watching your
# own repos. An App is installed by whoever owns the repos, on the repos they
# pick, with no credential ever handed over; rate limits are per installation,
# offboarding is an uninstall, and its comments land as `[bot]` rather than as a
# person. Register the App with Repository permissions `Contents: Read and
# write`, `Workflows: Read and write`, `Issues: Read and write`, `Pull requests:
# Read and write`, and `Metadata: Read`. Existing installations must approve a
# later permission increase before their tokens receive it. The App wins when
# both credential forms are set. `comet-board doctor` reports which one is live,
# which repos it reaches, whether ordinary and workflow-file pushes are
# deliverable, and when an App token expires. Fine-grained/opaque tokens do not
# expose equivalent scope evidence and therefore fail the push preflight closed.
[github]
repos = []
# The fallback filter, not the law — an empty list means every open issue.
# Repos want different answers here: a curated tracker is right to say
# "everything", while a repo that keeps its roadmap as open issues would put
# its whole backlog on the board. Override per repo below.
labels = ["herd"]
# Show open pull requests as their own `review` rows — work waiting on you that
# nobody dispatched. A PR from a board dispatch attaches to its task instead.
pull_requests = true
# Leave a trail on GitHub: a comment on dispatch and on outcome, and close the
# issue on done. Needs a token with `repo` scope, or an App with Issues: read &
# write.
# Off by default: the board should not start writing to your issues just
# because you pointed it at a repo.
#
# The fallback, not the law — repos differ here more than anything else does. A
# comment on a project of your own is provenance nobody minds; the same comment
# on a production repo lands on an issue other people read. Override per repo
# below, and `doctor` names the repos it will write to.
writeback = false
# Deliver review comments back into the chat that wrote the pull request.
#
# A task in `review` keeps its chat, so the agent that wrote the PR still has
# the whole task in context — and a review is a notification it has no way to
# receive. This queues the comment, the PR url, and for an inline comment the
# file and line into that chat. Issue comments, inline comments and review
# submissions all count; `changes requested` is the loudest and is not an
# issue comment at all.
#
# On by default, unlike `writeback`: this writes nothing to anybody's
# repository, it queues into a chat of your own. Delivery rides the command
# ledger, so a comment reaches the agent exactly once.
deliver_reviews = true

# One repo, answering differently from the list above. `name` must also appear
# in `repos` — a table naming anything else is settings that apply to nothing,
# and `doctor` refuses it rather than letting it sit there looking effective.
#
# Omit `labels` to fall back to `[github] labels`; `labels = []` is every open
# issue, said out loud. Omit `writeback` to fall back to `[github] writeback`.
#
# [[github.repo]]
# name = "bredebjorhovd/itsm-agent"
# labels = ["release-a"]
#
# [[github.repo]]
# name = "Florin-AS/Tally"
# writeback = false

# Who the people driving this board are, on GitHub. Keyed by the email each one
# signs in to comet with — that is what a dispatch arrives as — and valued with
# their git author address:
#
# [users]
# "ana@example.com" = "22494697+ana@users.noreply.github.com"
# "sam@example.com" = "Sam Ito <8134+samito@users.noreply.github.com>"
#
# With an entry here, that person's dispatched commits are authored by them;
# the box stays the committer, which is what actually happened. With none,
# every dispatch commits under the box's own git identity whoever released it —
# nothing rejects that, and it reads as the box owner's work on GitHub until
# somebody looks. On a repo behind a contributor gate it is a refused deploy.
#
# Write it with the verb rather than by hand: `comet-board member add
# ana@example.com --github ana` resolves the login through the board's GitHub
# credential, refuses a value that is not an address, and is idempotent.
# `comet-board member list` prints the map beside this device's agent-account
# slots and says who has one without the other — the pairing being the half
# nobody thinks about, since a mapped teammate with no slot spends somebody
# else's subscription. docs/teammate.md is the whole sequence.
#
# A file rather than a directory service: a two-person box does not need one,
# and nothing here can answer "which GitHub account is this person?" on its own
# — the board's App may not read anybody's verified addresses.
#
# One entry, two different questions (gh#369). The address above decides who a
# dispatch *commits* as. A token in `.env` named after the same login decides
# who a verdict is *cast* as:
#
#   GITHUB_USER_TOKEN_ANA=ghp_…              in the board's .env, never here
#
# GitHub refuses `APPROVE` on a pull request the caller opened, and the board's
# credential opened every dispatched one — so without a token of their own, a
# reviewer's approval arrives as a comment that says it approves. With one, it
# is an approving review with their name on it. The hyphen in a login is an
# underscore in the variable (`octo-cat` → GITHUB_USER_TOKEN_OCTO_CAT), and
# `comet-board doctor` says who has one, who does not, and whether the identity
# that opens the pull requests is also the one reviewing them — which is the
# one arrangement no token can rescue.

# The board lists git repos that have a comet space but no config here, in an
# UNADOPTED section. Ignoring is needed because you open a chat in plenty of
# repos you are only reading — another org's, a dependency, something you
# cloned to look at. Delete a line to be offered that repo again.
[adopt]
ignore = []
