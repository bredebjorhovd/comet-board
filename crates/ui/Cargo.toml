[package]
name = "comet-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
comet-proto.workspace = true
comet-doc.workspace = true
# The injection previews (gh#606) render through the harness adapters' own
# MCP-config builders, so a settings page can never show a flag the run does
# not get. Already in the graph via comet-engine.
comet-harness.workspace = true
# The board's config types (gh#75): the routing settings page renders
# `RoutingConfig` as the board parsed it, rather than a second twin of the
# same TOML that would drift key by key. Already in the graph via comet-engine.
comet-board.workspace = true
comet-engine.workspace = true
comet-rpc.workspace = true
comet-update.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
alacritty_terminal.workspace = true
base64 = "0.22"
unicode-segmentation.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true

# AppKit for `app_icon` — the Dock/Cmd-Tab icon and the menu-bar status item.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[dev-dependencies]
tempfile.workspace = true
gpui = { workspace = true, features = ["test-support"] }
