[package]
name = "comet-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
comet-proto.workspace = true
comet-board.workspace = true
comet-doc.workspace = true
comet-sync.workspace = true
comet-harness.workspace = true
comet-rpc.workspace = true
comet-update.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
libc.workspace = true
sha2.workspace = true
hmac.workspace = true
reqwest.workspace = true
# The repository recipe (gh#422) is TOML, like every other file an operator or
# a repository writes for comet. Same version the board reads `routing.toml`
# with, so a workspace holds one copy of it.
toml = "1.1"

[dev-dependencies]
tempfile.workspace = true
# `tests/onboard_clone.rs` reads the log back: gh#317's claim is that a git
# failure is written down, which is only testable with a subscriber attached.
tracing-subscriber.workspace = true
tokio-tungstenite.workspace = true
# The fake edge in `tests/edge_reconnect.rs` answers real loro-protocol frames,
# so the room clients under test take their production path end to end.
loro-protocol.workspace = true
# `test-util` = the paused clock (`#[tokio::test(start_paused = true)]`), so the
# stall-watchdog tests can cross a 10-minute window without waiting for one.
tokio = { workspace = true, features = ["test-util"] }
