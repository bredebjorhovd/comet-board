[package]
name = "comet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "comet"
path = "src/main.rs"

[dependencies]
comet-engine.workspace = true
# For the board CLI's version, reported by `comet status` (gh#156). Already in
# the tree under comet-engine; direct here because the check has to run in a
# binary the release upgrades, and a stale comet-board cannot report on itself.
comet-board.workspace = true
comet-proto.workspace = true
comet-rpc.workspace = true
comet-ui.workspace = true
comet-tui.workspace = true
comet-update.workspace = true
tokio.workspace = true
clap.workspace = true
mimalloc.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
